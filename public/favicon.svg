<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#ff40a0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Cyber Hexagon Frame -->
  <polygon points="256,48 440,154 440,366 256,472 72,366 72,154" 
           fill="none" 
           stroke="url(#neonPink)" 
           stroke-width="8" 
           stroke-linejoin="round"
           filter="url(#neonGlow)"
           opacity="0.85"/>

  <!-- Inner Cyberpunk Lightning Bolt -->
  <polygon points="280,88 160,272 248,272 208,432 368,232 276,232" 
           fill="url(#neonCyan)" 
           stroke="#ffffff" 
           stroke-width="4" 
           stroke-linejoin="round"
           filter="url(#neonGlow)"/>

  <!-- Center Highlight Core -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
